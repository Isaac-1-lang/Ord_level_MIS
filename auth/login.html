<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #2510e14e;
            color: #E8EAED;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #7b32ce;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group img {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
        }
        .input-group .password-icon {
            cursor: pointer;
            position: relative;
            top: 50px;
        }
        .input-group .password-icon:hover {
            filter: brightness(0.8);
        }
        .input-group input[type="email"] {
            display: inline-block;
            margin-top: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #5f6368;
            border-radius: 4px;
            background-color: #264da1;
            color: #E8EAED;
            font-size: 16px;
        }

        .input-group input::placeholder {
            color: #9AA0A6;
        }

        .input-group input:focus {
            outline: none;
            border-color: #8ab4f8;
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password a {
            color: #8ab4f8;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .signin-btn {
            background-color: #8ab4f8;
            color: #000000;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        .signin-btn:hover {
            background-color: #669df6;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
        .link p {
            font-size: 14px;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9AA0A6;
            font-size: 14px;
            background: none;
            border: none;
            outline: none;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #E8EAED;
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="title">Sign In</div>
        <form class="login-form" onsubmit="handleSubmit(event)">
            <div class="input-group">
                <img src="../assets/images/account_circle_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png" alt="User Icon">
                <input type="text" placeholder="Username" required name="username">
            </div>
            <div class="input-group">
                <img src="../assets/images/mail_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png" alt="Email Icon">
                <input type="email" placeholder="Email" required name="email">
            </div>
            <div class="input-group">
                <img src="../assets/images/visibility_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png" alt="Password Icon" class="password-icon" onclick="togglePassword()">
                <input type="password" placeholder="Password" required name="password">
                <div class="forgot-password">
                    <a href="mailto:isaprecieux112@gmail.com">Forgot password?</a>
                </div>
            </div>
            <div class="input-group">
                <img src="../assets/images/phone_in_talk_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png" alt="Phone Icon">
                <input type="tel" placeholder="Phone Number" required name="phone_number">
            </div>
            <button type="submit" class="signin-btn">Sign In</button>
        </form>
        <div class="link">
            <p>Don't have an account ? <a href="./signup.html">Sign up</a></p>
        </div>
    </main>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const formValues = Object.fromEntries(formData.entries());
            
            console.log('Form submitted with values:', formValues);
            alert('Form submitted successfully!');
        }
        function togglePassword() {
            const passwordField = document.getElementById('password-field');
            const toggleButton = document.querySelector('.password-toggle');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleButton.textContent = 'Hide';
            } else {
                passwordField.type = 'password';
                toggleButton.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
